<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#0a0414"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>
    <linearGradient id="neonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="400" cy="400" r="400" fill="url(#bgGrad)"/>
  <circle cx="400" cy="400" r="360" fill="none" stroke="#2a1a4a" stroke-width="1" opacity="0.5"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="#2a1a4a" stroke-width="1" opacity="0.3"/>

  <!-- Same original mark: triangular ears + wedge muzzle, scaled up to fill the circle more -->
  <g filter="url(#glow)">
    <!-- Left ear (triangle) -->
    <polygon points="255,95 340,470 175,440" fill="url(#neonGrad)" opacity="0.95"/>
    <!-- Right ear (triangle) -->
    <polygon points="545,95 460,470 625,440" fill="url(#neonGrad2)" opacity="0.95"/>
    <!-- Head / muzzle wedge -->
    <polygon points="400,270 545,510 400,650 255,510" fill="url(#neonGrad)" opacity="0.9"/>
    <!-- Muzzle tip triangle cut -->
    <polygon points="400,650 485,510 315,510" fill="#0a0414"/>
  </g>

  <!-- Eyes: two minimal diamond cuts -->
  <g filter="url(#softGlow)">
    <polygon points="345,440 362,459 345,478 328,459" fill="#0a0414"/>
    <polygon points="455,440 472,459 455,478 438,459" fill="#0a0414"/>
  </g>

  <!-- thin accent lines radiating from head -->
  <g stroke="url(#neonGrad)" stroke-width="2" opacity="0.5" filter="url(#softGlow)">
    <line x1="400" y1="140" x2="400" y2="95"/>
    <line x1="255" y1="95" x2="210" y2="60"/>
    <line x1="545" y1="95" x2="590" y2="60"/>
  </g>

  <!-- outer ring -->
  <circle cx="400" cy="400" r="392" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.6" filter="url(#softGlow)"/>
</svg>
