name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"   # every 12 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: jswalks
          options: bg_color=0a0414&color=00f0ff&line=b026ff&point=e0e0ff&area=true&area_color=b026ff&hide_border=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push activity-graph.svg to output-graph branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-graph
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
